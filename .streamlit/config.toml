# spaceH 공통 테마 (루트 design.md). 화면 코드에서 색·글꼴을 따로 정하지 않는다.
# 테마로 안 되는 배지·각주·하이라이트 스타일만 app/common/ui.py의 apply_theme()에 있다.

[theme]
base = "light"
primaryColor = "#009944"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F8F9FA"
textColor = "#111111"
linkColor = "#004098"
borderColor = "#E9ECEF"
greenColor = "#009944"
yellowColor = "#FABE00"
blueColor = "#004098"
baseRadius = "6px"
buttonRadius = "4px"
# 네오현대를 기본으로 사용하고 로딩 실패 시 시스템 글꼴을 사용한다.
font = '"NeoHyundai", "Segoe UI", sans-serif'
baseFontSize = 14

[[theme.fontFaces]]
family = "NeoHyundai"
url = "app/static/fonts/NeoHyundai-R.ttf"
weight = 400

[[theme.fontFaces]]
family = "NeoHyundai"
url = "app/static/fonts/NeoHyundai-B.ttf"
weight = 700

[server]
enableStaticServing = true

[client]
# 오른쪽 위 메뉴를 최소로 (헤더를 CSS로 숨기면 사이드바 버튼까지 사라진다)
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
