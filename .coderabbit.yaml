# CodeRabbit AI 리뷰 설정. 보조 리뷰이며 승인 1명에 포함되지 않는다 (docs/conventions/ai.md).
language: ko-KR

reviews:
  profile: chill
  # 요약은 PR 본문이 아니라 walkthrough 코멘트에 단다 (PR 템플릿 유지)
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  poem: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  suggested_labels: false
  suggested_reviewers: false
  collapse_walkthrough: true
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    - "!data/**"
  path_instructions:
    - path: "app/**/*.py"
      instructions: |
        - 계층은 views → services → repositories. views에서 DB·Chroma를 직접 부르면 지적한다.
        - 권한(S-03)은 Chroma where 절의 사전 필터로만 건다. 검색 후 결과를 걸러 내는 사후 필터는 지적한다.
        - SQL은 PyMySQL 원시 SQL + %s 바인딩만 쓴다. f-string·format으로 만든 SQL과 ORM 도입은 지적한다.
        - requirements.txt에 없는 패키지나 수업 밖 기술(FastAPI, ORM, LangGraph, pytest, requests, bcrypt 등)을 제안하지 않는다.
        - 비밀값은 core/config.py(.env)로만 읽는다.
    - path: "tests/**/*.py"
      instructions: "테스트는 unittest로 쓴다. pytest를 제안하지 않는다."
    - path: "docs/**"
      instructions: "문서 문체와 표현은 지적하지 않는다. 코드·다른 문서와 내용이 어긋나는 부분만 지적한다."

knowledge_base:
  code_guidelines:
    filePatterns:
      - AGENTS.md
      - docs/conventions/coding.md
      - docs/decisions.md

chat:
  auto_reply: true
